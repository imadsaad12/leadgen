# Title taxonomy for rule-based classification. Edit freely; `leadgen reclassify` re-applies it offline.
# Matching runs on the lower-cased, abbreviation-expanded title. Patterns are Python regexes.
version: 1

# Segments: the first segment is the primary title, the rest become function tags.
separators: [" || ", " | ", "|", " • ", "•", " · ", "·", " – ", " — ", " - ", ";", ",", " / ", "/"]

# Removed before classification.
noise_patterns:
  - "\\([^)]*\\)"
  - "\\[[^\\]]*\\]"
  - "\\b(mba|phd|ph\\.d\\.?|cpa|cfa|pmp|cissp|cism|cisa|frm|acca|aca|cma|msc|bsc|m\\.sc\\.?|b\\.sc\\.?|b\\.eng\\.?|m\\.eng\\.?|dipl\\.?-?ing\\.?|dr\\.?|prof\\.?|ir\\.?|eng\\.?|ms|ba|bba|llm|jd)\\b"
  - "\\b(ex-[a-z0-9&.]+)\\b"
  - "\\b(he/him|she/her|they/them|he/his|she/hers|him/his|her/hers)\\b"
  - "[\"'“”‘’`]"
  - "\\b(hiring|we're hiring|we are hiring|open to work|opentowork|looking for|seeking)\\b.*$"
  - "\\b(?:to|für|pour|para|of) (?:the |der |dem |des |la |le |el )?(?:ceo|cfo|coo|cto|cmo|cio|chief [a-z ]+officer|board(?: of directors)?|founders?|managing director|executive team|leadership team|management team|general manager|vice president[a-z ]*|vp[a-z ]*|president|director[a-z ]*|head of [a-z ]+|geschäftsführ\\w+|gf)\\s*$"

